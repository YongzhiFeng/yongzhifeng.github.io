<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 5 - My Book Store</title>

    <!-- Requirement 1: Use Bootstrap to style the one-page website -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>
<body>
    <main class="container mt-4">
        <h1>My Book Store</h1>
        <p>Register to shop for books.</p>

        <!-- Requirement 1: Create a form with all five registration fields -->
        <form id="registrationForm" novalidate>
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" id="firstName" class="form-control">
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" id="lastName" class="form-control">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control">
                <p>Include at least one ! or ? in your password.</p>
            </div>

            <div class="mb-3">
                <label for="dob" class="form-label">Date of Birth</label>
                <input type="date" id="dob" class="form-control">
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <!-- Requirement 5: Display the registration result and user information -->
        <h2 id="result" class="mt-4"></h2>
        <p id="showFirstName"></p>
        <p id="showLastName"></p>
        <p id="showEmail"></p>
        <p id="showPassword"></p>
        <p id="showDob"></p>
    </main>

    <!-- Requirement 2: Read the form inputs into a User Object -->
    <script>
        function readUser() {
            let user = {
                firstName: document.getElementById("firstName").value.trim(),
                lastName: document.getElementById("lastName").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value,
                dob: document.getElementById("dob").value
            };

            return user;
        }
    </script>

    <!-- Requirement 4: Check that all fields are filled and the password contains ! or ? -->
    <script>
        function validateUser(user) {
            if (
                user.firstName === "" ||
                user.lastName === "" ||
                user.email === "" ||
                user.password.trim() === "" ||
                user.dob === ""
            ) {
                return "Registration failed. Please fill in all fields.";
            }

            if (
                !user.password.includes("!") &&
                !user.password.includes("?")
            ) {
                return "Registration failed. Password must contain ! or ?.";
            }

            return "Registration Successful!";
        }
    </script>

    <!-- Requirement 3: Replace the password with the same number of asterisks -->
    <script>
        function hidePassword(user) {
            user.password = "*".repeat(user.password.length);
        }
    </script>

    <!-- Requirement 5: Write the result and information from the User Object to the DOM -->
    <script>
        function displayUser(user, message) {
            document.getElementById("result").textContent = message;

            document.getElementById("showFirstName").textContent =
                "First Name: " + user.firstName;

            document.getElementById("showLastName").textContent =
                "Last Name: " + user.lastName;

            document.getElementById("showEmail").textContent =
                "Email Address: " + user.email;

            document.getElementById("showPassword").textContent =
                "Password: " + user.password;

            document.getElementById("showDob").textContent =
                "Date of Birth: " + user.dob;
        }
    </script>

    <!-- Handle form submission without reloading the page -->
    <script>
        document.getElementById("registrationForm").onsubmit = function(event) {
            event.preventDefault();

            let user = readUser();
            let message = validateUser(user);

            hidePassword(user);
            displayUser(user, message);
        };
    </script>
</body>
</html>
